services:
  db:
    image: postgres:15
    container_name: otodom_postgres
    environment:
      POSTGRES_USER: admin  
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: otodom_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - otodom-net

  etl:
    build: .
    container_name: otodom_etl_runner
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=otodom_db
      - DB_USER=admin
      - DB_PASSWORD=admin
    depends_on:
      - db
    networks:
      - otodom-net

volumes:
  pgdata:

networks:
  otodom-net:
    driver: bridge